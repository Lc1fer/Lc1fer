name: Merge Rules

on:
  schedule:
    - cron: '30 22 * * *'

  workflow_dispatch:

  push:
    paths:
      - 'Rule/merge.yaml'
      - 'Script/merge-rules.js'
      - '.github/workflows/merge-rules.yml'

permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate rules
        run: node Script/merge-rules.js

      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- Rule/*.txt

          if git diff --cached --quiet; then
            echo "No rule content changes."
            exit 0
          fi

          git commit -m "Merge rules"
          git push
