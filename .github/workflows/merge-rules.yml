name: Merge Rules

on:
  schedule:
    # 北京时间每天 06:30（UTC 22:30）
    - cron: '30 22 * * *'

  workflow_dispatch:

  push:
    paths:
      - 'Rule/merge.yaml'
      - 'Script/merge-rules.js'
      - '.github/workflows/merge-rules.yml'

permissions:
  contents: write

# 同一分支的工作流串行执行，避免同时提交。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      # 下载部分失败时，脚本仍会生成其他分类；允许继续提交这些更新。
      - name: Generate rules
        id: generate
        continue-on-error: true
        run: node Script/merge-rules.js

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 仅暂存规则文本文件；没有匹配文件时也能正常结束。
          mapfile -d '' rule_files < <(git ls-files --cached --others --exclude-standard -z -- ':(glob)Rule/*.txt')
          if (( ${#rule_files[@]} == 0 )); then
            echo "No rule files found."
            exit 0
          fi
          git add -- "${rule_files[@]}"

          if git diff --cached --quiet; then
            echo "No rule content changes."
            exit 0
          fi

          git commit -m "Merge rules"
          git push

      # continue-on-error 不应掩盖生成失败；提交后恢复失败状态。
      - name: Report generation failure
        if: ${{ !cancelled() && steps.generate.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::error::Rule generation failed. See the generation and commit steps for details."
          exit 1
