name: Merge Rules

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'Rule/merge.txt'
      - '.github/workflows/merge-rules.yml'

permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate and commit rules
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_FILE="Rule/merge.txt"
          CHANGED_FILES=()

          if [ ! -f "$SOURCE_FILE" ]; then
            echo "ERROR: $SOURCE_FILE not found."
            exit 1
          fi

          discover_rules() {
            awk '
              { sub(/\r$/, "") }
              /^#[^[:space:]]+[[:space:]]+url$/ {
                name=$0
                sub(/^#/, "", name)
                sub(/[[:space:]]+url$/, "", name)
                if (!seen[name]++) print name
              }
            ' "$SOURCE_FILE"
          }

          extract_section() {
            local section="$1"

            awk -v section="#$section" '
              { sub(/\r$/, "") }

              $0 == section {
                found_section=1
                wait_open=1
                next
              }

              wait_open && $0 == "[" {
                inside=1
                found_open=1
                wait_open=0
                next
              }

              inside && $0 == "]" {
                found_close=1
                exit
              }

              inside { print }

              END {
                if (!found_section) exit 2
                if (!found_open) exit 3
                if (!found_close) exit 4
              }
            ' "$SOURCE_FILE"
          }

          clean_section() {
            sed \
              -e 's/\r$//' \
              -e 's/^[[:space:]]*//' \
              -e 's/[[:space:]]*$//' \
              -e '/^$/d' \
              -e '/^#/d'
          }

          get_urls() {
            extract_section "$1" | clean_section
          }

          get_custom_rules() {
            extract_section "$1" | clean_section
          }

          download_sources() {
            local urls="$1"
            local output="$2"

            : > "$output"

            local total=0
            local success=0
            local failed=0

            while IFS= read -r url; do
              [ -z "$url" ] && continue

              total=$((total + 1))
              echo "Downloading: $url"

              if curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --retry 3 \
                --retry-delay 2 \
                --connect-timeout 15 \
                --max-time 60 \
                "$url" >> "$output"
              then
                echo >> "$output"
                success=$((success + 1))
                echo "  ✓ Success"
              else
                failed=$((failed + 1))
                echo "  ✗ Failed"
              fi
            done <<< "$urls"

            echo "Sources total:     $total"
            echo "Sources succeeded: $success"
            echo "Sources failed:    $failed"

            [ "$failed" -eq 0 ] && [ "$success" -eq "$total" ]
          }

          clean_rules() {
            sed \
              -e 's/\r$//' \
              -e 's/^[[:space:]]*//' \
              -e 's/[[:space:]]*$//' \
              -e '/^$/d' \
              -e '/^#/d'
          }

          get_existing_rules() {
            local input="$1"
            local output="$2"

            if [ ! -f "$input" ]; then
              : > "$output"
              return 0
            fi

            {
              if head -n 1 "$input" | grep -q '^# 更新时间：'; then
                tail -n +3 "$input"
              else
                cat "$input"
              fi
            } | clean_rules | LC_ALL=C sort -u > "$output"
          }

          generate_rule() {
            local name="$1"
            local output="Rule/$name.txt"

            if [[ ! "$name" =~ ^[A-Za-z0-9._+-]+$ ]]; then
              echo "ERROR: Invalid rule name: $name"
              exit 1
            fi

            local external custom merged cleaned sorted existing final urls
            local has_urls=0

            external=$(mktemp)
            custom=$(mktemp)
            merged=$(mktemp)
            cleaned=$(mktemp)
            sorted=$(mktemp)
            existing=$(mktemp)
            final=$(mktemp)

            urls=$(get_urls "$name url")

            if [ -n "$urls" ]; then
              has_urls=1

              if ! download_sources "$urls" "$external"; then
                echo "WARNING: source download failed for $name."
                echo "Keep existing file: $output"
                rm -f "$external" "$custom" "$merged" "$cleaned" "$sorted" "$existing" "$final"
                return 0
              fi
            else
              : > "$external"
            fi

            get_custom_rules "$name" > "$custom"

            if [ "$has_urls" -eq 0 ] && [ ! -s "$custom" ]; then
              echo "SKIP: $name has no URLs or custom rules."
              rm -f "$external" "$custom" "$merged" "$cleaned" "$sorted" "$existing" "$final"
              return 0
            fi

            cat "$external" "$custom" > "$merged"
            clean_rules < "$merged" > "$cleaned"
            LC_ALL=C sort -u "$cleaned" > "$sorted"

            if [ ! -s "$sorted" ]; then
              echo "WARNING: generated rules are empty for $name."
              echo "Keep existing file: $output"
              rm -f "$external" "$custom" "$merged" "$cleaned" "$sorted" "$existing" "$final"
              return 0
            fi

            get_existing_rules "$output" "$existing"

            if [ -f "$output" ] && cmp -s "$sorted" "$existing"; then
              echo "UNCHANGED: $output"
              rm -f "$external" "$custom" "$merged" "$cleaned" "$sorted" "$existing" "$final"
              return 0
            fi

            {
              echo "# 更新时间：$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
              echo
              cat "$sorted"
            } > "$final"

            mv "$final" "$output"
            CHANGED_FILES+=("$output")

            echo "UPDATED: $output"
            echo "Unique rules: $(wc -l < "$sorted")"

            rm -f "$external" "$custom" "$merged" "$cleaned" "$sorted" "$existing"
          }

          mapfile -t RULE_NAMES < <(discover_rules)

          if [ "${#RULE_NAMES[@]}" -eq 0 ]; then
            echo "ERROR: No rule sections found in $SOURCE_FILE."
            exit 1
          fi

          echo "Discovered rule sets:"
          printf '  - %s\n' "${RULE_NAMES[@]}"

          for name in "${RULE_NAMES[@]}"; do
            generate_rule "$name"
          done

          if [ "${#CHANGED_FILES[@]}" -eq 0 ]; then
            echo "No rule content changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "${CHANGED_FILES[@]}"

          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi

          git commit -m "Merge rules"
          git push
